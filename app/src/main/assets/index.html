<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
:root{--bg:#07090f;--panel:#0e131d;--steel:#1c2536;--red:#c0171f;--gold:#f0b44c;--arc:#6af4ff;--text:#dfe9f3;--mute:#7f8ea3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% 25%,#10253a 0%,var(--bg) 62%);color:var(--text);
  font-family:'Rajdhani',sans-serif;font-size:18px;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
h1{font-family:'Orbitron',sans-serif;font-weight:700;font-size:20px;letter-spacing:.2em;color:var(--gold)}
.hbtn{background:none;border:1px solid var(--steel);color:var(--mute);border-radius:20px;padding:6px 12px;font:inherit;font-size:15px}
.hbtn.on{border-color:var(--arc);color:var(--arc)}
#stage{display:flex;flex-direction:column;align-items:center;padding:4px 0}
#reactor{width:min(56vw,230px);aspect-ratio:1;border:0;background:none;padding:0}
#reactor svg{width:100%;height:100%;overflow:visible}
.ring{transform-origin:100px 100px;fill:none;stroke:var(--arc)}
.r1{animation:spin 24s linear infinite}
.r2{animation:spin 14s linear infinite reverse;stroke:var(--gold)}
.core{fill:var(--arc);filter:drop-shadow(0 0 10px var(--arc))}
.glow{filter:drop-shadow(0 0 6px var(--arc))}
body[data-state=listening] .core{fill:#fff;animation:pulse .9s ease-in-out infinite}
body[data-state=thinking] .r1{animation-duration:2.5s}
body[data-state=thinking] .r2{animation-duration:1.8s}
body[data-state=speaking] .core{fill:var(--gold);filter:drop-shadow(0 0 14px var(--gold));animation:pulse .5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.55}}
#status{margin-top:6px;font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:.16em;color:var(--arc);min-height:18px;text-align:center;padding:0 12px}
#log{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:9px 14px;line-height:1.3;border-left:3px solid var(--arc);background:var(--panel)}
.m.me{align-self:flex-end;border-left:0;border-right:3px solid var(--gold);text-align:right}
.m.err{border-color:var(--red)}
form{display:flex;gap:8px;align-items:center;padding:10px 12px 14px}
#txt{flex:1;min-width:0;background:var(--panel);border:1px solid var(--steel);border-radius:22px;color:var(--text);padding:11px 14px;font:inherit;outline:none}
#txt:focus{border-color:var(--arc)}
.round{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#e0343b,var(--red) 60%,#6b0a10);color:#fff;font-size:12px;font-weight:700;flex:none;
  box-shadow:0 0 12px rgba(192,23,31,.55)}
.round.ig{background:radial-gradient(circle at 35% 30%,#f0b44c,#b8561f 60%,#6b2a0a);box-shadow:0 0 12px rgba(240,180,76,.45)}
.round.mic{width:54px;height:54px;font-size:22px;background:radial-gradient(circle at 35% 30%,#1b3550,#0c1a2a);border-color:var(--arc);box-shadow:0 0 14px rgba(106,244,255,.4)}
.round:active{transform:scale(.93)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px}
.overlay.show{display:flex}
.card{width:100%;max-width:420px;max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--gold);border-radius:6px;padding:18px}
.card h2{font-family:'Orbitron',sans-serif;font-size:16px;color:var(--gold);margin-bottom:10px}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:15px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--steel);color:var(--text);border-radius:4px;padding:9px 10px;font:inherit}
textarea{min-height:84px}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1;padding:10px;border-radius:4px;font:inherit;font-weight:600;border:1px solid var(--steel);background:none;color:var(--text)}
.row .save{background:var(--red);border-color:var(--gold)}
</style>
</head>
<body data-state="idle">
<header>
  <h1>JARVIS</h1>
  <div style="display:flex;gap:6px">
    <button class="hbtn" id="bub">Gol button</button>
    <button class="hbtn" id="live" aria-pressed="false">Live</button>
    <button class="hbtn" id="gear">Settings</button>
  </div>
</header>

<section id="stage">
  <button id="reactor" aria-label="Bolna shuru karein">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="ring r1 glow" cx="100" cy="100" r="92" stroke-width="2" stroke-dasharray="6 5"/>
      <circle class="ring r2" cx="100" cy="100" r="76" stroke-width="3" stroke-dasharray="40 8 4 8"/>
      <circle cx="100" cy="100" r="58" fill="none" stroke="#1c2536" stroke-width="10"/>
      <g class="glow" stroke="#6af4ff" stroke-width="3">
        <line x1="100" y1="46" x2="100" y2="68"/><line x1="100" y1="132" x2="100" y2="154"/>
        <line x1="46" y1="100" x2="68" y2="100"/><line x1="132" y1="100" x2="154" y2="100"/>
        <line x1="62" y1="62" x2="78" y2="78"/><line x1="138" y1="62" x2="122" y2="78"/>
        <line x1="62" y1="138" x2="78" y2="122"/><line x1="138" y1="138" x2="122" y2="122"/>
      </g>
      <polygon class="core" points="100,72 124,114 76,114"/>
      <circle cx="100" cy="100" r="30" fill="none" stroke="#6af4ff" stroke-width="2" class="glow"/>
    </svg>
  </button>
  <div id="status">STANDBY</div>
</section>

<div id="log"></div>

<form id="f">
  <button type="button" class="round" id="yt" aria-label="YouTube">YT</button>
  <button type="button" class="round ig" id="ig" aria-label="Instagram">IG</button>
  <input id="txt" placeholder="Likhiye ya mic dabaiye" autocomplete="off">
  <button type="button" class="round mic" id="mic" aria-label="Mic">&#127908;</button>
</form>

<div class="overlay" id="dlg"><div class="card">
  <h2>Settings</h2>
  <label for="s_key">API key (Anthropic)</label>
  <input id="s_key" type="password" placeholder="sk-ant-...">
  <label for="s_model">Model</label>
  <input id="s_model">
  <label for="s_user">Aapka naam</label>
  <input id="s_user">
  <label for="s_lang">Bhasha</label>
  <select id="s_lang">
    <option value="hi-IN">Hindi / Hinglish</option>
    <option value="en-IN">English (India)</option>
    <option value="en-US">English (US)</option>
  </select>
  <label for="s_rate">Bolne ki speed</label>
  <input id="s_rate" type="range" min="0.7" max="1.4" step="0.1">
  <label for="s_contacts">Contacts (har line: Naam,Dusra naam=Number)</label>
  <textarea id="s_contacts" placeholder="Abhishek,अभिषेक=9876543210"></textarea>
  <div class="row">
    <button type="button" id="cancel">Band karo</button>
    <button type="button" class="save" id="save">Save</button>
  </div>
</div></div>

<script>
const $ = id => document.getElementById(id);
let S = {}, history = [], live = false, busy = false, listening = false, empties = 0, bubOn = false;

function setState(st){
  document.body.dataset.state = st;
  listening = st === 'listening';
  $('status').textContent = {idle:'STANDBY',listening:'SUN RAHA HOON',thinking:'SOCH RAHA HOON',speaking:'BOL RAHA HOON'}[st];
}
function add(cls, text){
  const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = 1e9;
}
function loadSettings(){
  S = JSON.parse(Android.getSettings());
  $('s_model').value = S.model; $('s_user').value = S.user; $('s_lang').value = S.lang;
  $('s_rate').value = S.rate; $('s_contacts').value = S.contacts;
  $('s_key').placeholder = S.keySet ? 'Key saved hai (badalne ke liye naya daalein)' : 'sk-ant-...';
}
function listen(){ if (busy) return; setState('listening'); Android.listen(); }

function send(text){
  text = text.trim(); if (!text || busy) return;
  busy = true; add('me', text); history.push({role:'user', content:text}); setState('thinking');
  Android.ask(JSON.stringify(history));
}
// Android se aane wale callbacks
function onState(s){ if (s === 'listening') setState('listening'); }
function onHeard(t){
  if (t) { empties = 0; send(t); return; }
  setState('idle');
  if (live && ++empties < 3) setTimeout(listen, 600);
  else if (live) { live = false; $('live').classList.remove('on'); }
}
function onReply(r){
  history.push({role:'assistant', content:r}); add('', r);
  setState('speaking'); Android.speak(r);
}
function onSpoke(){
  busy = false; setState('idle');
  if (live) listen();
}

$('reactor').onclick = $('mic').onclick = () => listening ? Android.stop() : listen();
$('f').onsubmit = e => { e.preventDefault(); send($('txt').value); $('txt').value = ''; };
$('yt').onclick = () => { add('', 'YouTube khol raha hoon.'); Android.quick('open youtube'); };
$('ig').onclick = () => { add('', 'Instagram khol raha hoon.'); Android.quick('open instagram'); };
$('live').onclick = e => {
  live = !live; empties = 0; e.target.classList.toggle('on', live);
  if (live) listen(); else Android.stop();
};
$('bub').onclick = e => { bubOn = !bubOn; e.target.classList.toggle('on', bubOn); Android.bubble(bubOn); };
$('gear').onclick = () => $('dlg').classList.add('show');
$('cancel').onclick = () => $('dlg').classList.remove('show');
$('save').onclick = () => {
  Android.saveSettings(JSON.stringify({key:$('s_key').value, model:$('s_model').value, user:$('s_user').value,
    lang:$('s_lang').value, rate:+$('s_rate').value, contacts:$('s_contacts').value}));
  $('s_key').value = ''; loadSettings(); $('dlg').classList.remove('show');
};

loadSettings();
add('', 'Systems online. Namaste ' + S.user + ', main Jarvis hoon.');
if (!S.keySet) add('err', 'Pehle Settings mein API key daaliye.');
</script>
</body>
</html>
